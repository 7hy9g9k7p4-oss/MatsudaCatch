
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>下痢キャッチ</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    font-family: sans-serif;
    background: #171717;
    color: white;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

button {
    font-size: 18px;
    font-weight: bold;
    padding: 14px 28px;
    border: 0;
    border-radius: 10px;
    background: #ffcc00;
    color: #171717;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
    cursor: wait;
}

.screen {
    display: none;
    position: absolute;
    inset: 0;
    padding: 20px;
    overflow-y: auto;
    text-align: center;
}

.screen.active {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

h1 {
    font-size: clamp(34px, 9vw, 52px);
    margin: 0 0 18px;
}

p {
    line-height: 1.7;
}

#loadingArea {
    width: min(300px, 90%);
    margin: 20px auto;
}

#loadingBar {
    width: 100%;
    height: 18px;
    background: #444;
    border-radius: 10px;
    overflow: hidden;
}

#loadingProgress {
    width: 0%;
    height: 100%;
    background: #ffcc00;
    transition: width 0.1s;
}

#loadingText {
    font-size: 14px;
    color: #ccc;
}

#gameScreen {
    padding: 0;
    justify-content: flex-start;
    overflow: hidden;
}

#hud {
    z-index: 10;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 12px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    background: rgba(0, 0, 0, 0.65);
    font-size: 18px;
    font-weight: bold;
}

#game {
    position: absolute;
    inset: 0;
    overflow: hidden;
}

#player {
    position: absolute;
    width: 100px;
    height: 25px;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    border: 3px solid #ffcc00;
    border-radius: 5px;
    box-shadow: 0 0 12px rgba(255, 204, 0, 0.5);
}

.falling {
    position: absolute;
    width: 80px;
    height: auto;
    object-fit: contain;
    pointer-events: none;
    will-change: top, left;
}

#resultScreen {
    justify-content: flex-start;
    padding: 24px 14px;
}

#resultScreen h1 {
    font-size: 38px;
}

#finalScore {
    font-size: 36px;
    font-weight: bold;
    margin: 8px 0;
}

#bonusText {
    color: #ffcc00;
    font-weight: bold;
    font-size: 24px;
    margin: 5px 0 12px;
}

#resultComment {
    font-size: 19px;
    font-weight: bold;
    margin: 8px 0 20px;
}

.resultStats {
    width: 100%;
    max-width: 600px;
    margin: 0 auto 18px;
    padding: 12px;
    background: #292929;
    border-radius: 12px;
    text-align: left;
}

.resultStats h2 {
    margin: 0 0 10px;
    font-size: 21px;
}

.resultImages {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 10px;
}

.resultItem {
    min-width: 0;
    padding: 8px 4px;
    background: #3a3a3a;
    border-radius: 8px;
    text-align: center;
    overflow-wrap: anywhere;
}

.resultItem img {
    display: block;
    width: 100%;
    max-width: 100px;
    height: 85px;
    object-fit: contain;
    margin: 0 auto 5px;
}

.resultItem .count {
    font-size: 14px;
    font-weight: bold;
}

.resultItem .rarity {
    color: #ccc;
    font-size: 11px;
    margin-top: 4px;
}

#resultButtons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin: 10px 0 25px;
}

#resultButtons button {
    font-size: 16px;
    padding: 13px 20px;
}

#muteButton {
    position: absolute;
    z-index: 20;
    right: 10px;
    bottom: 10px;
    padding: 8px 12px;
    font-size: 13px;
    border-radius: 8px;
    opacity: 0.85;
}

.smallText {
    color: #ccc;
    font-size: 13px;
}
</style>
</head>

<body>

<section id="startScreen" class="screen active">
    <h1>下痢キャッチ</h1>

    <p>
        落ちてくる下痢を救え！<br>
        落ちるのは公務員試験だけで十分だ！
    </p>

    <div class="resultStats">
        <strong>ルール</strong>
        <p>
            ・落ちてくる下痢を台座で回収しろ！<br>
            ・金色は高得点！<br>
            ・レアは超高得点！<br>
            ・ハズレは大幅減点！<br>
            ・全部回収するとボーナス＋1,000,000点！
        </p>
    </div>

    <div id="loadingArea">
        <div id="loadingBar">
            <div id="loadingProgress"></div>
        </div>
        <p id="loadingText">画像を読み込み中... 0/55</p>
    </div>

    <button id="startButton" disabled>読み込み中...</button>
    <p class="smallText">制限時間：30秒</p>
</section>

<section id="gameScreen" class="screen">
    <div id="hud">
        <div>スコア：<span id="score">0</span></div>
        <div>残り：<span id="timer">30</span>秒</div>
    </div>

    <div id="game">
        <div id="player"></div>
    </div>

    <button id="muteButton">🔊 BGM ON</button>
</section>

<section id="resultScreen" class="screen">
    <h1>リザルト</h1>

    <div>最終スコア</div>
    <div id="finalScore">0</div>
    <div id="bonusText"></div>
    <div id="resultComment"></div>

    <div class="resultStats">
        <h2>回収結果</h2>
        <div id="caughtStats"></div>
        <p>回収した画像</p>
        <div id="caughtImages" class="resultImages"></div>
    </div>

    <div class="resultStats">
        <h2>取り逃した下痢</h2>
        <div id="missedStats"></div>
        <div id="missedImages" class="resultImages"></div>
    </div>

    <div id="resultButtons">
        <button id="retryButton">もう一度遊ぶ</button>
    </div>
</section>

<script>
const GAME_TIME = 30;
const SPAWN_INTERVAL = 700;
const ALL_CAUGHT_BONUS = 1000000;

const game = document.getElementById("game");
const player = document.getElementById("player");
const startButton = document.getElementById("startButton");
const muteButton = document.getElementById("muteButton");

const scoreElement = document.getElementById("score");
const timerElement = document.getElementById("timer");

const imageGroups = {
    normal: {
        count: 20,
        points: 10,
        label: "普通"
    },
    gold: {
        count: 15,
        points: 50,
        label: "ちょっと集まりにくい"
    },
    rare: {
        count: 10,
        points: 20020804,
        label: "激レア"
    },
    fake: {
        count: 10,
        points: -99999999,
        label: "ハズレ"
    }
};

const allImages = [];

for (const type of Object.keys(imageGroups)) {
    for (let i = 1; i <= imageGroups[type].count; i++) {
        allImages.push({
            src: `${type}${i}.jpeg`,
            type
        });
    }
}

let score = 0;
let timeLeft = GAME_TIME;
let spawnedCount = 0;
let caughtImages = [];
let missedImages = [];

let activeItems = new Set();
let spawnIntervalId = null;
let timerIntervalId = null;
let gameRunning = false;

let audioContext = null;
let musicTimer = null;
let musicStep = 0;
let musicEnabled = true;

let playerX = window.innerWidth / 2;

const melody = [
    523, 659, 784, 659,
    523, 659, 880, 784,
    659, 784, 988, 784,
    659, 523, 587, 659
];

const bass = [
    131, 131, 196, 196,
    175, 175, 131, 131
];

function showScreen(id) {
    document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");
}

function preloadImages() {
    let loaded = 0;

    const progress = document.getElementById("loadingProgress");
    const loadingText = document.getElementById("loadingText");

    const promises = allImages.map(item => {
        return new Promise(resolve => {
            const img = new Image();

            img.onload = () => {
                loaded++;
                updateProgress();
                resolve();
            };

            img.onerror = () => {
                loaded++;
                updateProgress();
                console.warn("画像を読み込めませんでした:", item.src);
                resolve();
            };

            img.src = item.src;
        });
    });

    function updateProgress() {
        const percentage = Math.round(
            loaded / allImages.length * 100
        );

        progress.style.width = percentage + "%";
        loadingText.textContent =
            `画像を読み込み中... ${loaded}/${allImages.length}`;
    }

    Promise.all(promises).then(() => {
        loadingText.textContent = "読み込み完了！";
        startButton.disabled = false;
        startButton.textContent = "ゲームスタート";
    });
}

function playNote(frequency, duration, waveType, volume) {
    if (!audioContext || !musicEnabled) return;

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = waveType;
    oscillator.frequency.setValueAtTime(
        frequency,
        audioContext.currentTime
    );

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + duration);
}

function playChiptuneNote() {
    if (!musicEnabled || !gameRunning) return;

    const melodyIndex = musicStep % melody.length;
    const bassIndex = musicStep % bass.length;

    playNote(melody[melodyIndex], 0.13, "square", 0.045);

    if (musicStep % 2 === 0) {
        playNote(bass[bassIndex], 0.22, "triangle", 0.07);
    }

    musicStep++;
}

async function startMusic() {
    stopMusic();

    if (!musicEnabled) return;

    try {
        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) return;

        if (!audioContext || audioContext.state === "closed") {
            audioContext = new AudioContextClass();
        }

        await audioContext.resume();

        if (!gameRunning || !musicEnabled) return;

        musicStep = 0;
        playChiptuneNote();

        musicTimer = setInterval(playChiptuneNote, 160);
    } catch (error) {
        console.warn("BGMを再生できませんでした:", error);
    }
}

function stopMusic() {
    if (musicTimer !== null) {
        clearInterval(musicTimer);
        musicTimer = null;
    }
}

muteButton.addEventListener("click", async event => {
    event.stopPropagation();

    musicEnabled = !musicEnabled;

    muteButton.textContent = musicEnabled
        ? "🔊 BGM ON"
        : "🔇 BGM OFF";

    if (musicEnabled && gameRunning) {
        await startMusic();
    } else {
        stopMusic();
    }
});

function getRarityName(type) {
    return imageGroups[type]?.label ?? "不明";
}

function chooseImage() {
    const r = Math.random();

    let type;

    if (r < 0.001) {
        type = "rare";
    } else if (r < 0.002) {
        type = "fake";
    } else if (r < 0.20) {
        type = "gold";
    } else {
        type = "normal";
    }

    const group = imageGroups[type];
    const number = Math.floor(Math.random() * group.count) + 1;

    return {
        src: `${type}${number}.jpeg`,
        type
    };
}

function updateScore() {
    scoreElement.textContent = score.toLocaleString();
}

function movePlayer(clientX) {
    if (!gameRunning) return;

    const width = player.offsetWidth;
    const minX = width / 2;
    const maxX = window.innerWidth - width / 2;

    playerX = Math.max(
        minX,
        Math.min(maxX, clientX)
    );

    player.style.left = playerX + "px";
}

game.addEventListener("pointermove", event => {
    if (event.pointerType === "mouse" ||
        event.pointerType === "pen" ||
        event.pointerType === "touch") {
        movePlayer(event.clientX);
    }
});

game.addEventListener("touchmove", event => {
    if (!gameRunning || event.touches.length === 0) return;

    event.preventDefault();
    movePlayer(event.touches[0].clientX);
}, { passive: false });

window.addEventListener("resize", () => {
    if (!gameRunning) return;
    movePlayer(playerX);
});

function removeActiveItem(item) {
    if (item.intervalId !== null) {
        clearInterval(item.intervalId);
        item.intervalId = null;
    }

    activeItems.delete(item);
    item.element.remove();
}

function createMatsuda() {
    if (!gameRunning) return;

    const imageData = chooseImage();

    const element = document.createElement("img");
    element.src = imageData.src;
    element.className = "falling";
    element.alt = imageData.type;

    const maxLeft = Math.max(0, window.innerWidth - 80);
    const left = Math.random() * maxLeft;

    element.style.left = left + "px";
    element.style.top = "-90px";

    game.appendChild(element);

    const item = {
        element,
        src: imageData.src,
        type: imageData.type,
        y: -90,
        x: left,
        speed: 3 + Math.random() * 3,
        intervalId: null,
        resolved: false
    };

    spawnedCount++;
    activeItems.add(item);

    item.intervalId = setInterval(() => {
        if (!gameRunning || item.resolved) return;

        item.y += item.speed;
        element.style.top = item.y + "px";

        const mRect = element.getBoundingClientRect();
        const pRect = player.getBoundingClientRect();

        const matsudaCenter = mRect.left + mRect.width / 2;

        // 台座の中央60%をキャッチ判定範囲にする
        const catcherLeft = pRect.left + pRect.width * 0.20;
        const catcherRight = pRect.right - pRect.width * 0.20;

        const verticalHit =
            mRect.bottom >= pRect.top &&
            mRect.bottom <= pRect.top + 15;

        const horizontalHit =
            matsudaCenter >= catcherLeft &&
            matsudaCenter <= catcherRight;

        if (verticalHit && horizontalHit) {
            item.resolved = true;

            score += imageGroups[item.type].points;

            caughtImages.push({
                src: item.src,
                type: item.type
            });

            updateScore();
            removeActiveItem(item);
            return;
        }

        // 台座を通過した場合は取り逃しとして記録
        if (mRect.top > pRect.bottom ||
            item.y > game.clientHeight + 150) {
            item.resolved = true;

            missedImages.push({
                src: item.src,
                type: item.type
            });

            removeActiveItem(item);
        }
    }, 20);
}

function renderImageResults(containerId, images) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";

    if (images.length === 0) {
        container.textContent = "なし";
        return;
    }

    const grouped = new Map();

    images.forEach(item => {
        const key = `${item.type}:${item.src}`;

        if (!grouped.has(key)) {
            grouped.set(key, {
                ...item,
                count: 0
            });
        }

        grouped.get(key).count++;
    });

    grouped.forEach(item => {
        const card = document.createElement("div");
        card.className = "resultItem";

        const img = document.createElement("img");
        img.src = item.src;
        img.alt = getRarityName(item.type);
        img.loading = "lazy";

        const count = document.createElement("div");
        count.className = "count";
        count.textContent = `×${item.count}`;

        const rarity = document.createElement("div");
        rarity.className = "rarity";
        rarity.textContent = getRarityName(item.type);

        card.appendChild(img);
        card.appendChild(count);
        card.appendChild(rarity);

        container.appendChild(card);
    });
}

function getResultComment(finalScore) {
    if (finalScore < 0) {
        return {
            text: "これじゃ来世もTPRに落ちるじゃねぇか",
            color: "#45a5ff"
        };
    }

    if (finalScore < 1000) {
        return {
            text: "まぁこんなもんだろ",
            color: "#62df7a"
        };
    }

    if (finalScore < 10000) {
        return {
            text: "10月までは耐久できたようだな",
            color: "#62df7a"
        };
    }

    if (finalScore < 1000000) {
        return {
            text: "絶対パワーナップしてるやん",
            color: "#ffad42"
        };
    }

    if (finalScore < 20020804) {
        return {
            text: "マイクロスリープした？",
            color: "#ff5252"
        };
    }

    return {
        text: "畦地健誠かと思ったぜ",
        color: "#c17aff"
    };
}

function endGame() {
    if (!gameRunning) return;

    gameRunning = false;

    clearInterval(spawnIntervalId);
    clearInterval(timerIntervalId);

    spawnIntervalId = null;
    timerIntervalId = null;

    stopMusic();

    // 終了時に画面内に残っている落下物も取り逃しとして記録
    [...activeItems].forEach(item => {
        if (!item.resolved) {
            item.resolved = true;

            missedImages.push({
                src: item.src,
                type: item.type
            });
        }

        removeActiveItem(item);
    });

    // 1個以上生成され、取り逃しが一つもなければボーナス
    const bonus =
        spawnedCount > 0 && missedImages.length === 0
            ? ALL_CAUGHT_BONUS
            : 0;

    const finalScore = score + bonus;

    document.getElementById("finalScore").textContent =
        finalScore.toLocaleString();

    document.getElementById("bonusText").textContent =
        bonus > 0
            ? `全回収ボーナス ＋${bonus.toLocaleString()}点！`
            : "全回収ボーナスなし";

    const comment = getResultComment(finalScore);

    const resultComment = document.getElementById("resultComment");
    resultComment.textContent = comment.text;
    resultComment.style.color = comment.color;

    document.getElementById("caughtStats").textContent =
        `回収：${caughtImages.length}個`;

    document.getElementById("missedStats").textContent =
        `取り逃し：${missedImages.length}個`;

    renderImageResults("caughtImages", caughtImages);
    renderImageResults("missedImages", missedImages);

    showScreen("resultScreen");
}

function startGame() {
    clearInterval(spawnIntervalId);
    clearInterval(timerIntervalId);
    stopMusic();

    [...activeItems].forEach(item => {
        if (item.intervalId !== null) {
            clearInterval(item.intervalId);
        }
        item.element.remove();
    });

    activeItems.clear();

    score = 0;
    timeLeft = GAME_TIME;
    spawnedCount = 0;
    caughtImages = [];
    missedImages = [];

    gameRunning = true;

    updateScore();
    timerElement.textContent = timeLeft;

    document.getElementById("bonusText").textContent = "";
    document.getElementById("caughtImages").innerHTML = "";
    document.getElementById("missedImages").innerHTML = "";

    playerX = window.innerWidth / 2;
    player.style.left = playerX + "px";

    showScreen("gameScreen");

    startMusic();

    createMatsuda();

    spawnIntervalId = setInterval(() => {
        if (gameRunning) createMatsuda();
    }, SPAWN_INTERVAL);

    timerIntervalId = setInterval(() => {
        if (!gameRunning) return;

        timeLeft--;
        timerElement.textContent = timeLeft;

        if (timeLeft <= 0) {
            endGame();
        }
    }, 1000);
}

startButton.addEventListener("click", startGame);
document.getElementById("retryButton").addEventListener("click", startGame);

preloadImages();
</script>

</body>
</html>
