<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>下痢キャッチ</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    font-family: sans-serif;
    background: #111;
}

body {
    position: fixed;
    inset: 0;
}

#game {
    position: relative;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    touch-action: none;
    background: linear-gradient(#87ceeb, #eaf9ff);
}


/* =========================
   スタート画面
========================= */

#startScreen {
    position: absolute;
    inset: 0;
    z-index: 1000;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    background: linear-gradient(#87ceeb, #eaf9ff);
}

.startBox {
    width: min(90%, 420px);
    max-height: 90%;
    overflow-y: auto;

    padding: 30px 25px;

    text-align: center;

    background: rgba(255,255,255,0.95);

    border: 3px solid #111;
    border-radius: 20px;
}

.startTitle {
    margin: 0 0 20px;

    font-size: 42px;
    font-weight: bold;
}

.description {
    margin-bottom: 20px;

    font-size: 18px;
    line-height: 1.6;
}

.rules {
    margin: 0 auto 25px;

    padding: 15px;

    text-align: left;

    background: #f2f2f2;

    border-radius: 12px;

    font-size: 16px;
    line-height: 1.7;
}

.loadingMessage {
    margin-bottom: 15px;

    font-size: 16px;
    font-weight: bold;
}

#startButton {
    width: 100%;

    padding: 15px;

    font-size: 24px;
    font-weight: bold;

    border: none;
    border-radius: 12px;

    background: #222;
    color: white;

    cursor: pointer;
}

#startButton:disabled {
    background: #aaa;
    cursor: not-allowed;
}


/* =========================
   スコア・タイマー
========================= */

#score {
    position: absolute;
    top: 15px;
    left: 15px;

    z-index: 100;

    font-size: 24px;
    font-weight: bold;

    color: #111;
}

#timer {
    position: absolute;
    top: 15px;
    right: 15px;

    z-index: 100;

    font-size: 24px;
    font-weight: bold;

    color: #111;
}


/* =========================
   キャッチャー
========================= */

#player {
    position: absolute;

    bottom: 50px;
    left: 50%;

    transform: translateX(-50%);

    width: 100px;
    height: 25px;

    background: white;

    border-radius: 10px;
    border: 3px solid #111;

    z-index: 50;
}


/* =========================
   下痢
========================= */

.matsuda {
    position: absolute;

    top: -150px;

    width: 80px;
    height: auto;

    user-select: none;
    pointer-events: none;

    z-index: 20;
}


/* =========================
   ゲームオーバー
========================= */

#gameover {
    display: none;

    position: absolute;

    top: 30%;
    left: 50%;

    transform: translateX(-50%);

    z-index: 200;

    width: min(90%, 400px);

    text-align: center;

    background: rgba(255,255,255,0.95);

    padding: 30px;

    border-radius: 20px;

    border: 3px solid #111;
}

#gameover h1 {
    margin: 0 0 15px;

    font-size: 40px;
}

#finalScore {
    font-size: 24px;
    font-weight: bold;

    margin-bottom: 20px;
}

#restart {
    padding: 12px 25px;

    font-size: 20px;
    font-weight: bold;

    border: none;
    border-radius: 10px;

    cursor: pointer;
}

</style>
</head>


<body>

<div id="game">


    <!-- =========================
         スタート画面
    ========================== -->

    <div id="startScreen">

        <div class="startBox">

            <h1 class="startTitle">
                下痢キャッチ
            </h1>


            <div class="description">

                落ちてくる下痢を救え!<br>
                落ちるのは公務員試験だけで十分だ!

            </div>


            <div class="rules">

                <strong>ルール</strong><br>

                ・下痢が落ちる前に台座を動かして回収しろ!レアな下痢は点数が高いしハズレっぽい下痢は減点だ！

            </div>


            <div
                id="loadingMessage"
                class="loadingMessage"
            >
                準備中...
            </div>


            <button
                id="startButton"
                disabled
            >
                はじめる
            </button>

        </div>

    </div>


    <!-- =========================
         ゲーム本体
    ========================== -->

    <div id="score">
        SCORE: 0
    </div>


    <div id="timer">
        TIME: 30
    </div>


    <div id="player"></div>


    <!-- =========================
         ゲームオーバー
    ========================== -->

    <div id="gameover">

        <h1>
            GAME OVER
        </h1>

        <div id="finalScore">
            SCORE: 0
        </div>

        <button id="restart">
            もう一回
        </button>

    </div>

</div>


<script>


/* =========================
   設定
========================= */

const NORMAL_COUNT = 20;
const GOLD_COUNT = 15;
const RARE_COUNT = 10;
const FAKE_COUNT = 10;

const GAME_TIME = 30;

const SPAWN_INTERVAL = 700;


/* =========================
   DOM
========================= */

const game =
    document.getElementById("game");

const player =
    document.getElementById("player");

const scoreText =
    document.getElementById("score");

const timerText =
    document.getElementById("timer");

const gameover =
    document.getElementById("gameover");

const finalScore =
    document.getElementById("finalScore");

const restartButton =
    document.getElementById("restart");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const loadingMessage =
    document.getElementById("loadingMessage");


/* =========================
   ゲーム状態
========================= */

let score = 0;

let timeLeft = GAME_TIME;

let gameRunning = false;

let spawnTimer = null;

let countdownTimer = null;


/* =========================
   画像一覧
========================= */

const imageList = [];


/* 普通 */

for (
    let i = 1;
    i <= NORMAL_COUNT;
    i++
) {

    imageList.push({

        type: "normal",

        src: `normal${i}.jpeg`,

        point: 10

    });

}


/* ちょいレア */

for (
    let i = 1;
    i <= GOLD_COUNT;
    i++
) {

    imageList.push({

        type: "gold",

        src: `gold${i}.jpeg`,

        point: 50

    });

}


/* レア */

for (
    let i = 1;
    i <= RARE_COUNT;
    i++
) {

    imageList.push({

        type: "rare",

        src: `rare${i}.jpeg`,

        point: 20020804

    });

}


/* ハズレ */

for (
    let i = 1;
    i <= FAKE_COUNT;
    i++
) {

    imageList.push({

        type: "fake",

        src: `fake${i}.jpeg`,

        point: -99999999

    });

}


/* =========================
   画像読み込み
========================= */

function preloadImages() {

    let loaded = 0;

    const total =
        imageList.length;


    imageList.forEach(item => {

        const img =
            new Image();


        img.onload = () => {

            loaded++;

            checkLoadingComplete();

        };


        img.onerror = () => {

            loaded++;

            checkLoadingComplete();

        };


        img.src = item.src;

    });


    function checkLoadingComplete() {

        if (loaded >= total) {

            loadingMessage.textContent =
                "準備完了！";

            startButton.disabled = false;

        }

    }

}


/* =========================
   下痢生成
========================= */

function createMatsuda() {

    if (!gameRunning) {
        return;
    }


    /* =========================
       レア度抽選
    ========================= */

    const r =
        Math.random();


    let type;


    if (r < 0.80) {

        type = "normal";

    }

    else if (r < 0.998) {

        type = "gold";

    }

    else if (r < 0.999) {

        type = "rare";

    }

    else {

        type = "fake";

    }


    /* =========================
       該当画像を選択
    ========================= */

    const candidates =
        imageList.filter(
            item => item.type === type
        );


    const item =
        candidates[
            Math.floor(
                Math.random()
                * candidates.length
            )
        ];


    /* =========================
       画像作成
    ========================= */

    const matsuda =
        document.createElement("img");


    matsuda.className =
        "matsuda";


    matsuda.src =
        item.src;


    matsuda.draggable =
        false;


    matsuda.style.width =
        "80px";


    /* =========================
       横位置
    ========================= */

    const size = 80;


    const maxX =
        game.clientWidth - size;


    const x =
        Math.random() * maxX;


    matsuda.style.left =
        x + "px";


    /* =========================
       落下速度
       全種類共通
    ========================= */

    const speed = 4;


    matsuda.style.top =
        "-120px";


    game.appendChild(
        matsuda
    );


    let y = -120;


    /* =========================
       落下処理
    ========================= */

    const fallTimer =
        setInterval(() => {


            if (!gameRunning) {

                clearInterval(
                    fallTimer
                );

                matsuda.remove();

                return;

            }


            y += speed;


            matsuda.style.top =
                y + "px";


            /* =========================
               当たり判定
            ========================= */

            const mRect =
                matsuda.getBoundingClientRect();


            const pRect =
                player.getBoundingClientRect();


            const hit =
                mRect.bottom >= pRect.top &&
                mRect.top <= pRect.bottom &&
                mRect.right >= pRect.left &&
                mRect.left <= pRect.right;


            if (hit) {

                score +=
                    item.point;


                updateScore();


                clearInterval(
                    fallTimer
                );


                matsuda.remove();


                return;

            }


            /* =========================
               画面外
            ========================= */

            if (
                y >
                game.clientHeight + 150
            ) {

                clearInterval(
                    fallTimer
                );

                matsuda.remove();

            }


        }, 16);

}


/* =========================
   スコア更新
========================= */

function updateScore() {

    scoreText.textContent =
        `SCORE: ${score.toLocaleString()}`;

}


/* =========================
   プレイヤー移動
========================= */

function movePlayer(x) {

    const width =
        player.offsetWidth;


    let newX =
        x - width / 2;


    const maxX =
        game.clientWidth - width;


    if (newX < 0) {

        newX = 0;

    }


    if (newX > maxX) {

        newX = maxX;

    }


    player.style.left =
        newX + "px";


    player.style.transform =
        "none";

}


/* =========================
   PC操作
========================= */

document.addEventListener(
    "mousemove",
    e => {

        if (!gameRunning) {
            return;
        }


        movePlayer(
            e.clientX
        );

    }
);


/* =========================
   スマホ操作
========================= */

document.addEventListener(
    "touchmove",
    e => {

        if (!gameRunning) {
            return;
        }


        if (
            e.touches.length === 0
        ) {

            return;

        }


        e.preventDefault();


        movePlayer(
            e.touches[0].clientX
        );

    },
    {
        passive: false
    }
);


/* =========================
   ゲーム開始
========================= */

function startGame() {

    score = 0;

    timeLeft =
        GAME_TIME;

    gameRunning =
        true;


    updateScore();


    timerText.textContent =
        `TIME: ${timeLeft}`;


    gameover.style.display =
        "none";


    startScreen.style.display =
        "none";


    /* 既存の下痢を削除 */

    document
        .querySelectorAll(".matsuda")
        .forEach(el => el.remove());


    /* 生成開始 */

    spawnTimer =
        setInterval(
            createMatsuda,
            SPAWN_INTERVAL
        );


    /* カウントダウン */

    countdownTimer =
        setInterval(() => {


            timeLeft--;


            timerText.textContent =
                `TIME: ${timeLeft}`;


            if (
                timeLeft <= 0
            ) {

                endGame();

            }


        }, 1000);

}


/* =========================
   ゲーム終了
========================= */

function endGame() {

    gameRunning =
        false;


    clearInterval(
        spawnTimer
    );


    clearInterval(
        countdownTimer
    );


    document
        .querySelectorAll(".matsuda")
        .forEach(el => el.remove());


    finalScore.textContent =
        `SCORE: ${score.toLocaleString()}`;


    gameover.style.display =
        "block";

}


/* =========================
   はじめるボタン
========================= */

startButton.addEventListener(
    "click",
    () => {

        if (
            startButton.disabled
        ) {

            return;

        }


        startGame();

    }
);


/* =========================
   もう一回
========================= */

restartButton.addEventListener(
    "click",
    () => {

        startGame();

    }
);


/* =========================
   読み込み開始
========================= */

preloadImages();


</script>

</body>
</html>
